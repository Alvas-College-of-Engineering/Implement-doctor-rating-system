<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MedRate —Doctor Rating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   CSS VARIABLES & RESET
══════════════════════════════════════ */
:root {
  --bg:        #0a0f1a;
  --surface:   #111827;
  --card:      #151f2e;
  --border:    #1e2d42;
  --accent:    #38bdf8;
  --accent2:   #818cf8;
  --gold:      #f59e0b;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --success:   #34d399;
  --danger:    #f87171;
  --radius:    14px;
  --font-head: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-weight: 300;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ══════════════════════════════════════
   BACKGROUND GRID TEXTURE
══════════════════════════════════════ */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(56,189,248,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,189,248,.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ══════════════════════════════════════
   HEADER
══════════════════════════════════════ */
header {
  position: relative;
  z-index: 10;
  padding: 52px 40px 40px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(56,189,248,.06) 0%, transparent 100%);
}

.header-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid rgba(56,189,248,.3);
  padding: 4px 14px;
  border-radius: 100px;
  margin-bottom: 18px;
}

header h1 {
  font-family: var(--font-head);
  font-size: clamp(2.2rem, 5vw, 3.6rem);
  font-weight: 700;
  line-height: 1.1;
  background: linear-gradient(135deg, #e2e8f0 30%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 10px;
}

header p {
  color: var(--muted);
  font-size: .95rem;
  max-width: 420px;
  margin: 0 auto;
}

/* ══════════════════════════════════════
   STATS BAR
══════════════════════════════════════ */
.stats-bar {
  position: relative; z-index: 10;
  display: flex;
  justify-content: center;
  gap: 0;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.stat {
  padding: 18px 36px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.stat:last-child { border-right: none; }

.stat-value {
  display: block;
  font-family: var(--font-head);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--accent);
}
.stat-label {
  font-size: .75rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ══════════════════════════════════════
   MAIN GRID
══════════════════════════════════════ */
main {
  position: relative; z-index: 10;
  max-width: 1260px;
  margin: 0 auto;
  padding: 52px 24px 80px;
}

.section-title {
  font-family: var(--font-head);
  font-size: 1.5rem;
  font-weight: 500;
  margin-bottom: 32px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}

.doctor-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
}

/* ══════════════════════════════════════
   DOCTOR CARD
══════════════════════════════════════ */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform .25s ease, box-shadow .25s ease;
  display: flex;
  flex-direction: column;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 50px rgba(0,0,0,.4), 0 0 0 1px var(--border);
}

/* Coloured top accent strip */
.card-accent { height: 4px; }
.accent-blue   { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.accent-purple { background: linear-gradient(90deg, var(--accent2), #ec4899); }
.accent-teal   { background: linear-gradient(90deg, #2dd4bf, var(--accent)); }
.accent-amber  { background: linear-gradient(90deg, var(--gold), #f87171); }

.card-body { padding: 24px; flex: 1; }

/* Doctor avatar initials */
.avatar {
  width: 52px; height: 52px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head);
  font-size: 1.2rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 16px;
  flex-shrink: 0;
}
.avatar-blue   { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.avatar-purple { background: linear-gradient(135deg, var(--accent2), #ec4899); }
.avatar-teal   { background: linear-gradient(135deg, #2dd4bf, var(--accent)); }
.avatar-amber  { background: linear-gradient(135deg, var(--gold), #f87171); }

.card-header-row {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 16px;
}

.card-info h2 {
  font-family: var(--font-head);
  font-size: 1.1rem;
  font-weight: 500;
  margin-bottom: 2px;
}
.specialization {
  font-size: .78rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 500;
}

/* Star display */
.stars-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.stars { font-size: 1.1rem; letter-spacing: 1px; }
.avg-number {
  font-family: var(--font-head);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--text);
}
.total-count { font-size: .78rem; color: var(--muted); margin-top: 2px; }

/* Rating bar */
.rating-bar-wrap {
  height: 4px;
  background: var(--border);
  border-radius: 100px;
  margin-bottom: 20px;
  overflow: hidden;
}
.rating-bar-fill {
  height: 100%;
  border-radius: 100px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width .6s cubic-bezier(.4,0,.2,1);
}

/* ── Rating Input Section ── */
.rate-section {
  border-top: 1px solid var(--border);
  padding: 18px 24px;
}

.rate-label {
  font-size: .75rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  display: block;
}

.star-picker {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}

.star-btn {
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  transition: transform .15s ease;
  color: var(--border);
  line-height: 1;
  padding: 0 2px;
}
.star-btn:hover,
.star-btn.active {
  color: var(--gold);
  transform: scale(1.2);
}

.patient-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: .85rem;
  padding: 8px 12px;
  margin-bottom: 10px;
  outline: none;
  transition: border-color .2s;
}
.patient-input:focus { border-color: var(--accent); }
.patient-input::placeholder { color: var(--muted); }

.submit-btn {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  font-family: var(--font-body);
  font-size: .85rem;
  font-weight: 500;
  letter-spacing: .05em;
  cursor: pointer;
  transition: opacity .2s, transform .15s;
}
.submit-btn:hover { opacity: .88; transform: translateY(-1px); }
.submit-btn:active { transform: translateY(0); }

/* ── Toast / feedback ── */
.toast {
  display: none;
  margin-top: 10px;
  font-size: .82rem;
  color: var(--success);
  text-align: center;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

/* ── History panel ── */
.history-toggle {
  background: none;
  border: none;
  color: var(--muted);
  font-size: .78rem;
  cursor: pointer;
  padding: 6px 0;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-body);
  letter-spacing: .08em;
  text-transform: uppercase;
  transition: color .2s;
  margin-top: 4px;
}
.history-toggle:hover { color: var(--accent); }
.toggle-arrow { transition: transform .25s; display: inline-block; }
.toggle-arrow.open { transform: rotate(180deg); }

.history-list {
  display: none;
  margin-top: 12px;
  max-height: 200px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.history-list.open { display: block; }

.history-item {
  padding: 8px 10px;
  border-left: 2px solid var(--border);
  margin-bottom: 8px;
  font-size: .82rem;
  animation: fadeIn .3s ease;
}
.history-item .hi-name { font-weight: 500; color: var(--text); }
.history-item .hi-stars { color: var(--gold); font-size: .9rem; }
.history-item .hi-comment { color: var(--muted); font-style: italic; }
.history-item .hi-date { color: var(--muted); font-size: .72rem; margin-top: 2px; }

/* ══════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════ */
@media (max-width: 600px) {
  header { padding: 36px 20px 28px; }
  .stats-bar { flex-wrap: wrap; }
  .stat { flex: 1 1 40%; border: none; border-bottom: 1px solid var(--border); }
  main { padding: 36px 16px 60px; }
}
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header>
  <div class="header-badge">Patient Portal</div>
  <h1>MedRate</h1>
  <p>Rate your doctors and help others make informed healthcare decisions.</p>
</header>

<!-- ══ STATS BAR ══ -->
<div class="stats-bar">
  <div class="stat">
    <span class="stat-value" id="stat-doctors">4</span>
    <span class="stat-label">Doctors</span>
  </div>
  <div class="stat">
    <span class="stat-value" id="stat-ratings">0</span>
    <span class="stat-label">Ratings</span>
  </div>
  <div class="stat">
    <span class="stat-value" id="stat-avg">—</span>
    <span class="stat-label">System Avg</span>
  </div>
</div>

<!-- ══ MAIN ══ -->
<main>
  <p class="section-title">Our Specialists</p>
  <div class="doctor-grid" id="doctorGrid"></div>
</main>

<script>
/* ══════════════════════════════════════
   JavaScript — Doctor Rating System
   Mirrors the Java OOP structure:
     - doctors[]  ≈ ArrayList<Doctor>
     - addRating()≈ Doctor.addRating()
     - calcAvg()  ≈ Doctor.calculateAverage()
══════════════════════════════════════ */

// ── Data (mirrors Doctor constructor) ──
const doctors = [
  { id:"D001", name:"Dr. Aisha Kapoor",  spec:"Cardiology",   accent:"blue",   ratings:[], selectedStars:0 },
  { id:"D002", name:"Dr. Rohan Mehta",   spec:"Neurology",    accent:"purple", ratings:[], selectedStars:0 },
  { id:"D003", name:"Dr. Priya Nair",    spec:"Pediatrics",   accent:"teal",   ratings:[], selectedStars:0 },
  { id:"D004", name:"Dr. Samuel D'Cruz", spec:"Dermatology",  accent:"amber",  ratings:[], selectedStars:0 },
];

// ── calculateAverage() ──
function calcAvg(ratings) {
  if (!ratings.length) return 0;
  return ratings.reduce((s,r) => s + r.stars, 0) / ratings.length;
}

// ── Render stars ──
function starsHTML(avg, max=5) {
  let html = '';
  for (let i = 1; i <= max; i++) {
    if (avg >= i)         html += '★';
    else if (avg >= i-.5) html += '⯨';
    else                  html += '☆';
  }
  return html;
}

// ── initials from name ──
function initials(name) {
  return name.replace('Dr. ','').split(' ').map(w=>w[0]).slice(0,2).join('');
}

// ── today's date ──
function today() {
  return new Date().toISOString().slice(0,10);
}

// ── addRating() — mirrors Doctor.addRating() ──
function addRating(doctorId) {
  const doc      = doctors.find(d => d.id === doctorId);
  const stars    = doc.selectedStars;
  const name     = document.getElementById(`name-${doctorId}`).value.trim() || 'Anonymous';
  const comment  = document.getElementById(`comment-${doctorId}`).value.trim() || 'No comment.';

  if (stars === 0) {
    alert('Please select a star rating first.');
    return;
  }

  // Push Rating object (mirrors Rating constructor)
  doc.ratings.push({ patient: name, stars, comment, date: today() });

  // Reset inputs
  doc.selectedStars = 0;
  document.getElementById(`name-${doctorId}`).value = '';
  document.getElementById(`comment-${doctorId}`).value = '';

  renderCard(doc);
  updateStats();
  showToast(doctorId);
}

// ── Show toast ──
function showToast(id) {
  const el = document.getElementById(`toast-${id}`);
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2800);
}

// ── Toggle history panel ──
function toggleHistory(id) {
  const list  = document.getElementById(`hist-${id}`);
  const arrow = document.getElementById(`arrow-${id}`);
  list.classList.toggle('open');
  arrow.classList.toggle('open');
}

// ── Set selected stars on a card ──
function setStars(doctorId, val) {
  const doc = doctors.find(d => d.id === doctorId);
  doc.selectedStars = val;
  for (let i = 1; i <= 5; i++) {
    const btn = document.getElementById(`star-${doctorId}-${i}`);
    btn.classList.toggle('active', i <= val);
  }
}

// ── renderCard() — re-renders a single doctor card ──
function renderCard(doc) {
  const avg   = calcAvg(doc.ratings);
  const pct   = (avg / 5) * 100;
  const card  = document.getElementById(`card-${doc.id}`);

  card.innerHTML = buildCardHTML(doc, avg, pct);
}

// ── buildCardHTML() ──
function buildCardHTML(doc, avg, pct) {
  const avgDisplay = doc.ratings.length ? avg.toFixed(1) : '—';

  // History items
  const histHTML = doc.ratings.length === 0
    ? '<div class="history-item"><span class="hi-comment">No ratings yet.</span></div>'
    : [...doc.ratings].reverse().map(r => `
        <div class="history-item">
          <div class="hi-name">${escHtml(r.patient)} <span class="hi-stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span></div>
          <div class="hi-comment">"${escHtml(r.comment)}"</div>
          <div class="hi-date">${r.date}</div>
        </div>`).join('');

  return `
    <div class="card-accent accent-${doc.accent}"></div>
    <div class="card-body">
      <div class="card-header-row">
        <div class="avatar avatar-${doc.accent}">${initials(doc.name)}</div>
        <div class="card-info">
          <h2>${escHtml(doc.name)}</h2>
          <div class="specialization">${escHtml(doc.spec)}</div>
        </div>
      </div>

      <div class="stars-row">
        <div>
          <div class="stars">${avg ? starsHTML(avg) : '☆☆☆☆☆'}</div>
          <div class="total-count">${doc.ratings.length} rating${doc.ratings.length!==1?'s':''}</div>
        </div>
        <div class="avg-number">${avgDisplay}</div>
      </div>

      <div class="rating-bar-wrap">
        <div class="rating-bar-fill" style="width:${pct}%"></div>
      </div>

      <!-- History toggle -->
      <button class="history-toggle" onclick="toggleHistory('${doc.id}')">
        Rating History
        <span class="toggle-arrow" id="arrow-${doc.id}">▾</span>
      </button>
      <div class="history-list" id="hist-${doc.id}">${histHTML}</div>
    </div>

    <!-- Rate Section -->
    <div class="rate-section">
      <span class="rate-label">Submit Your Rating</span>
      <div class="star-picker">
        ${[1,2,3,4,5].map(i=>`<button class="star-btn${doc.selectedStars>=i?' active':''}" id="star-${doc.id}-${i}" onclick="setStars('${doc.id}',${i})">★</button>`).join('')}
      </div>
      <input class="patient-input" id="name-${doc.id}" type="text" placeholder="Your name (optional)" />
      <input class="patient-input" id="comment-${doc.id}" type="text" placeholder="Leave a comment (optional)" />
      <button class="submit-btn" onclick="addRating('${doc.id}')">Submit Rating</button>
      <div class="toast" id="toast-${doc.id}">✓ Thank you! Your rating was recorded.</div>
    </div>`;
}

// ── updateStats() — updates the top stats bar ──
function updateStats() {
  const totalRatings = doctors.reduce((s,d)=>s+d.ratings.length, 0);
  document.getElementById('stat-ratings').textContent = totalRatings;

  const allRatings = doctors.flatMap(d=>d.ratings);
  if (allRatings.length) {
    const sysAvg = allRatings.reduce((s,r)=>s+r.stars,0) / allRatings.length;
    document.getElementById('stat-avg').textContent = sysAvg.toFixed(1) + ' ★';
  }
}

// ── escHtml() — basic XSS prevention ──
function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── init — build all cards ──
function init() {
  const grid = document.getElementById('doctorGrid');
  doctors.forEach(doc => {
    const div = document.createElement('div');
    div.className = 'card';
    div.id = `card-${doc.id}`;
    div.innerHTML = buildCardHTML(doc, 0, 0);
    grid.appendChild(div);
  });
  document.getElementById('stat-doctors').textContent = doctors.length;
}

init();
</script>
</body>
</html>
